<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tablet do Garçom</title>
    <style>
        body { font-family: sans-serif; background: #e0f2f1; color: #333; margin: 0; padding: 20px; }
        h1 { color: #004d40; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 8px; width: 260px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; }
        .alerta-prato { border-left: 5px solid #009688; }
        .alerta-prato h3 { color: #00796b; }
        .alerta-conta { border-left: 5px solid #e67e22; }
        .alerta-conta h3 { color: #d35400; }
    </style>
</head>
<body>
    <h1>🤵 Painel do Garçom</h1>
    <p>Aguardando notificações da cozinha e das mesas...</p>
    
    <div class="grid" id="painel-alertas">
        
        <!-- 🚨 NOVO BLOCO: Carrega as mesas que já pediram conta antes -->
        {% for mesa in mesas_aguardando %}
            <div class="card alerta-conta" id="mesa-conta-{{ mesa.numero }}">
                <h3>💰 Pedido de Conta!</h3>
                <p>Mesa {{ mesa.numero }} pediu o fechamento.</p>
                <p><strong>Total: R$ {{ mesa.total_da_conta }}</strong></p>
                <button onclick="liberarMesa({{ mesa.numero }})" style="background:#00796b; color:white; border:none; padding:10px; border-radius:4px; cursor:pointer; width:100%; margin-top:10px;">Confirmar Pagamento e Liberar</button>
            </div>
        {% endfor %}

    </div>

    <script>
        const socket = new WebSocket('ws://' + window.location.host + '/ws/garcom/');

        socket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            const painel = document.getElementById('painel-alertas');
            
            if (data.tipo === 'prato_pronto') {
                const card = document.createElement('div');
                card.className = 'card alerta-prato';
                card.innerHTML = `
                    <h3>🔔 Levar para Mesa ${data.mesa}</h3>
                    <p>Pedido #${data.pedido_id} finalizado!</p>
                `;
                painel.appendChild(card);
                tocarSom();
            }
            
            if (data.tipo === 'solicitacao_conta') {
                const card = document.createElement('div');
                card.className = 'card alerta-conta';
                card.id = `mesa-conta-${data.mesa}`;
                card.innerHTML = `
                    <h3>💰 Pedido de Conta!</h3>
                    <p>Mesa ${data.mesa} pediu o fechamento.</p>
                    <p><strong>Total: R$ ${data.total.toFixed(2)}</strong></p>
                    <button onclick="liberarMesa(${data.mesa})" style="background:#00796b; color:white; border:none; padding:10px; border-radius:4px; cursor:pointer; width:100%; margin-top:10px;">Confirmar Pagamento e Liberar</button>
                `;
                painel.appendChild(card);
                tocarSom();
            }
        };

        function liberarMesa(numeroMesa) {
            if (!confirm(`Confirmar pagamento e liberar a Mesa ${numeroMesa}?`)) {
                return;
            }

            fetch('/liberar-mesa/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mesa: numeroMesa })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'sucesso') {
                    const card = document.getElementById(`mesa-conta-${numeroMesa}`);
                    if (card) card.remove();
                    alert(`Mesa ${numeroMesa} liberada com sucesso!`);
                }
            });
        }

        function tocarSom() {
            const audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
            audio.play();
        }
    </script>
</body>
</html>
