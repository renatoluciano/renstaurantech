<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tablet da Mesa</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; color: #333; text-align: center; padding: 50px; }
        .order-btn { background: #27ae60; color: white; padding: 15px 30px; font-size: 20px; border: none; border-radius: 5px; cursor: pointer; }
        .order-btn:hover { background: #219653; }
        .status { margin-top: 20px; font-weight: bold; color: #27ae60; }
    </style>
</head>
<body>
    {% csrf_token %} 

    <h1>📱 Mesa 1</h1>
    <p>Clique no botão abaixo para simular um pedido e enviar para a cozinha.</p>
    
    <button class="order-btn" onclick="fazerPedido()">Fazer Pedido (1x Hambúrguer + 1x Refrigerante)</button>
    <div id="msg-status" class="status"></div>

    <script>
    function fazerPedido() {
        const btn = document.querySelector('.order-btn');
        btn.disabled = true;
        btn.innerText = "Enviando...";

        // Pega o token direto da tag que colocamos lá em cima
        const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        fetch('/fazer-pedido/', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken // Passa a prova de segurança para o Django
            }
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('msg-status').innerText = "Pedido enviado com sucesso para a cozinha!";
            btn.innerText = "Fazer Outro Pedido";
            btn.disabled = false;
        })
        .catch(error => {
            console.error('Erro:', error);
            document.getElementById('msg-status').innerText = "Erro ao enviar pedido!";
            btn.disabled = false;
            btn.innerText = "Tentar Novamente";
        });
    }
</script>

</body>
</html>
