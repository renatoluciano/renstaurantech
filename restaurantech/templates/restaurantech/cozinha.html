<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tablet da Cozinha</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
        .card { background: #333; padding: 15px; border-radius: 8px; width: 250px; border-left: 5px solid #e74c3c; }
        .card h3 { margin-top: 0; color: #e74c3c; }
        .card ul { padding-left: 20px; }
    </style>
</head>
<body>
    <h1>👨‍🍳 Pedidos na Cozinha</h1>
    <div class="grid" id="painel-pedidos">
        <!-- Os pedidos vão aparecer aqui magicamente -->
    </div>

        <script>
        const socket = new WebSocket('ws://' + window.location.host + '/ws/cozinha/');

        socket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            
            if (data.tipo === 'novo_pedido') {
                const painel = document.getElementById('painel-pedidos');
                
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `pedido-${data.pedido_id}`; // Adiciona um ID único para podermos remover depois
                
                let itensHtml = '';
                data.itens.forEach(item => {
                    itensHtml += `<li>${item}</li>`;
                });

                card.innerHTML = `
                    <h3>Mesa ${data.mesa}</h3>
                    <p>Pedido #${data.pedido_id}</p>
                    <ul>${itensHtml}</ul>
                    <!-- NOVO BOTÃO AQUI: -->
                    <button onclick="notificarPronto(${data.pedido_id}, ${data.mesa})" style="background:#27ae60; color:white; border:none; padding:10px; border-radius:4px; cursor:pointer; width:100%;">Marcar como Pronto</button>
                `;
                
                painel.appendChild(card);
            }
        };

        // NOVA FUNÇÃO AQUI:
        function notificarPronto(pedidoId, mesaNumero) {
            // Envia uma requisição para o Django avisando que está pronto
            fetch('/notificar-pronto/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pedido_id: pedidoId, mesa: mesaNumero })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'sucesso') {
                    // Remove o card da tela da cozinha pois já foi feito
                    const card = document.getElementById(`pedido-${pedidoId}`);
                    card.remove();
                }
            });
        }
    </script>

</body>
</html>
